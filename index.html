<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>С днём рождения!</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="bar" aria-hidden="true"></div>
  <div id="glow" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="controls">
    <button id="themeBtn" type="button" aria-label="Сменить тему">Тема</button>
    <button id="musicBtn" type="button" aria-label="Музыка" hidden>Музыка</button>
  </div>

  <main id="app"></main>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" type="button" aria-label="Закрыть">×</button>
    <button class="lb-prev" type="button" aria-label="Назад">‹</button>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button class="lb-next" type="button" aria-label="Вперёд">›</button>
  </div>

  <script src="./content.js"></script>
  <script src="./script.js"></script>
</body>
</html>
